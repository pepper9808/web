<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1 — Форма реєстрації</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <h1>Лабораторне заняття №1. Основи HTML</h1>
        <nav>
            <ul>
                <li><a href="../index.html">← Повернутися на головну</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Форма реєстрації користувача</h2>
            
            <!-- Заміни посилання в action на своє унікальне з сайту webhook.site -->
            <form action="https://webhook.site/9783a9aa-22d8-47ce-81eb-aa81321c352d" method="POST">
                
                <div class="form-group">
                    <label for="first-name">Ім'я користувача:</label>
                    <input type="text" id="first-name" name="first_name" placeholder="Введіть ваше ім'я" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Прізвище користувача:</label>
                    <input type="text" id="last-name" name="last_name" placeholder="Введіть ваше прізвище" required>
                </div>

                <div class="form-group">
                    <label for="email">Електронна пошта:</label>
                    <input type="email" id="email" name="email" placeholder="example@stud.duikt.edu.ua" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" minlength="6" placeholder="Мінімум 6 символів" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Підтвердження паролю:</label>
                    <input type="password" id="confirm-password" name="confirm_password" minlength="6" placeholder="Повторіть пароль" required>
                </div>

                <!-- Додаткові поля за вибором -->
                <div class="form-group">
                    <label for="birth-date">Дата народження:</label>
                    <input type="date" id="birth-date" name="birth_date">
                </div>

                <div class="form-group">
                    <label for="gender">Стать:</label>
                    <select id="gender" name="gender">
                        <option value="" disabled selected>Оберіть стать</option>
                        <option value="male">Чоловіча</option>
                        <option value="female">Жіноча</option>
                        <option value="other">Інша / Не вказувати</option>
                    </select>
                </div>

                <div class="form-group">
                    <input type="submit" value="Зареєструватися">
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Нікіта Дзюбенко</p>
    </footer>

</body>
</html>
